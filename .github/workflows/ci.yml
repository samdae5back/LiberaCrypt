name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'tools/build_wiki.py'
      - 'tools/translate_docs.py'
      - 'tools/prune_translations.py'
      - '.github/workflows/wiki-sync.yml'
      - '.github/workflows/translate-sync-docs.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'tools/build_wiki.py'
      - 'tools/translate_docs.py'
      - 'tools/prune_translations.py'
      - '.github/workflows/wiki-sync.yml'
      - '.github/workflows/translate-sync-docs.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=ON -DLIBERAC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Install package
        run: cmake --install build --config Release --prefix "${{ runner.temp }}/liberacrypt-install"
      - name: Configure installed-package consumer
        run: cmake -S tests/InstallConsumer -B build-consumer -DCMAKE_PREFIX_PATH="${{ runner.temp }}/liberacrypt-install" -DCMAKE_BUILD_TYPE=Release
      - name: Build installed-package consumer
        run: cmake --build build-consumer --config Release

  portability-32bit:
    name: Linux 32-bit release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install multilib toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - name: Configure
        env:
          CFLAGS: -m32
          LDFLAGS: -m32
        run: cmake -S . -B build-32 -DBUILD_SHARED_LIBS=OFF -DLIBERAC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-32 --parallel
      - name: Run unit tests
        run: ctest --test-dir build-32 -L unit -LE slow --output-on-failure --parallel 2

  portability-big-endian:
    name: Linux s390x big-endian release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install s390x cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
      - name: Create s390x CMake toolchain
        shell: bash
        run: |
          cat > s390x-toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR s390x)
          set(CMAKE_C_COMPILER s390x-linux-gnu-gcc)
          set(CMAKE_CROSSCOMPILING_EMULATOR qemu-s390x;-L;/usr/s390x-linux-gnu)
          EOF
      - name: Configure
        run: cmake -S . -B build-s390x -DCMAKE_TOOLCHAIN_FILE=s390x-toolchain.cmake -DBUILD_SHARED_LIBS=OFF -DLIBERAC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-s390x --parallel
      - name: Run endian-sensitive smoke tests under QEMU
        run: >-
          ctest --test-dir build-s390x
          -R 'LiberaCrypt\.(PublicAPI|BlockCipher|HashFunction|ModernSymmetric|Util\.Unit|KeyEncapsulation\.ML-KEM\.Unit)'
          --output-on-failure --parallel 2

  sanitizers:
    name: Ubuntu ASan + UBSan (ECC/RSA)
    runs-on: ubuntu-latest
    env:
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build-sanitize -DBUILD_SHARED_LIBS=OFF -DLIBERAC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build security-sensitive regression tests
        run: >-
          cmake --build build-sanitize --parallel --target
          liberacrypt_ecc_unit
          liberacrypt_ecc_differential
          crypto_ecdsa_unit
          crypto_ecdsa_kat
          crypto_ed25519_unit
          crypto_ed25519_kat
          crypto_rsa_pkcs1_test
      - name: Run ECC tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize -L ecc --output-on-failure
      - name: Run RSA tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize -L rsa --output-on-failure

  rsa-openssl-interop:
    name: RSA OpenSSL interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DBUILD_SHARED_LIBS=OFF -DLIBERAC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build interoperability driver
        run: cmake --build build --target crypto_rsa_openssl_interop
      - name: Generate OpenSSL key and components
        shell: bash
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out key.pem
          openssl pkey -in key.pem -pubout -out public.pem
          RSA_N_HEX="$(openssl rsa -in key.pem -noout -modulus | cut -d= -f2)"
          RSA_D_HEX="$(openssl pkey -in key.pem -text -noout | awk '
            /^privateExponent:/{capture=1; next}
            /^prime1:/{capture=0}
            capture {gsub(/[:[:space:]]/, ""); printf "%s", $0}
          ')"
          echo "RSA_N_HEX=${RSA_N_HEX}" >> "${GITHUB_ENV}"
          echo "RSA_D_HEX=${RSA_D_HEX}" >> "${GITHUB_ENV}"
      - name: Cross-check both directions
        shell: bash
        run: |
          printf '%s' 'LiberaCrypt dynamic OpenSSL OAEP interop' > oaep-message.bin
          printf '%s' 'LiberaCrypt dynamic OpenSSL PSS interop' > pss-message.bin
          openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in oaep-message.bin -out openssl-oaep.bin
          openssl dgst -sha256 -sign key.pem \
            -sigopt rsa_padding_mode:pss \
            -sigopt rsa_pss_saltlen:32 \
            -sigopt rsa_mgf1_md:sha256 \
            -out openssl-pss.bin pss-message.bin
          ./build/crypto_rsa_openssl_interop \
            "${RSA_N_HEX}" "${RSA_D_HEX}" \
            openssl-oaep.bin openssl-pss.bin \
            liberac-oaep.bin liberac-pss.bin
          openssl pkeyutl -decrypt -inkey key.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in liberac-oaep.bin -out recovered.bin
          cmp oaep-message.bin recovered.bin
          openssl dgst -sha256 -verify public.pem \
            -signature liberac-pss.bin \
            -sigopt rsa_padding_mode:pss \
            -sigopt rsa_pss_saltlen:32 \
            -sigopt rsa_mgf1_md:sha256 \
            pss-message.bin
