name: Translate & Sync Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**/*.md'
      - '!docs/i18n/**'
  workflow_dispatch:
    inputs:
      language:
        description: Translation language
        required: true
        default: all
        type: choice
        options:
          - all
          - ko
          - ja
      scope:
        description: Documents to translate
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all
      model:
        description: OpenAI model
        required: true
        default: gpt-5.6-sol
        type: choice
        options:
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna

permissions: {}

concurrency:
  group: liberacrypt-translate-sync
  cancel-in-progress: false

jobs:
  translate:
    name: Translate documentation
    runs-on: ubuntu-latest
    environment:
      name: docs-translation
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Translate & Sync Docs must be run from the main branch." >&2
            exit 1
          fi

      - name: Validate translation tooling
        run: |
          python3 -m py_compile tools/translate_docs.py tools/prune_translations.py tools/build_wiki.py

      - name: Check OpenAI API key
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in the docs-translation environment." >&2
            exit 1
          fi

      - name: Remove orphaned translations
        run: python3 tools/prune_translations.py

      - name: Translate documentation
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATE_LANGUAGE: ${{ inputs.language || 'all' }}
          TRANSLATE_SCOPE: ${{ inputs.scope || 'changed' }}
          TRANSLATE_MODEL: ${{ inputs.model || 'gpt-5.6-sol' }}
        run: |
          python3 tools/translate_docs.py \
            --language "$TRANSLATE_LANGUAGE" \
            --scope "$TRANSLATE_SCOPE" \
            --model "$TRANSLATE_MODEL"

      - name: Detect translation changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- docs/i18n)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated translation updates." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Translations are already up to date." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package translation updates
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: tar -czf "${RUNNER_TEMP}/translated-docs.tar.gz" docs/i18n

      - name: Upload translation artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: translated-docs-${{ github.run_id }}
          path: ${{ runner.temp }}/translated-docs.tar.gz
          if-no-files-found: error
          retention-days: 1

  propose:
    name: Propose translation update
    needs: translate
    if: needs.translate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download translation artifact
        uses: actions/download-artifact@v8
        with:
          name: translated-docs-${{ github.run_id }}
          path: ${{ runner.temp }}/translated-docs

      - name: Apply translation artifact
        shell: bash
        run: tar -xzf "${RUNNER_TEMP}/translated-docs/translated-docs.tar.gz" -C "$GITHUB_WORKSPACE"

      - name: Commit generated translations to automation branch
        id: commit
        shell: bash
        env:
          TRANSLATION_BRANCH: automation/docs-translations
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/i18n

          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No translation diff remained after applying the artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -m "docs: update generated translations"
          git fetch origin "${TRANSLATION_BRANCH}" || true
          git push --force-with-lease origin HEAD:"${TRANSLATION_BRANCH}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create or update translation pull request
        if: steps.commit.outputs.created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSLATION_BRANCH: automation/docs-translations
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$TRANSLATION_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            pr_url="$(gh pr view "$existing_pr" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
            echo "Updated existing translation PR: ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$TRANSLATION_BRANCH" \
            --title "docs: update generated translations" \
            --body $'Automated Korean/Japanese documentation update generated from the canonical English documentation.\n\nThis branch is managed by the `Translate & Sync Docs` workflow. Review and merge this pull request to publish the updated translations. The separate `Wiki Sync` workflow will publish the multilingual Wiki after the translation changes reach `main`.')"

          echo "Created translation PR: ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
